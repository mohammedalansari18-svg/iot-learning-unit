<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إنترنت الأشياء — مسار تعلم رقمي تفاعلي (4 وحدات RLOs)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://images.pexels.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#13262b; --deep:#0c2f35; --paper:#f4f7f8; --card:#fff; --line:#dfe7e9; --muted:#5d7277;
  --amber:#f2a516; --ok:#1e8e5a; --okbg:#e5f6ed; --bad:#c0392b; --badbg:#fdecea;
  --u:#0e8a83; --u-rgb:14,138,131; --u-dark:#0a5f5a; --u-soft:#e3f4f2;
  --shadow:0 1px 2px #0b2a3010,0 6px 20px #0b2a3014;
}
.u1{--u:#0e8a83;--u-rgb:14,138,131;--u-dark:#08524e;--u-soft:#e1f3f1}
.u2{--u:#5b4bd6;--u-rgb:91,75,214;--u-dark:#33289a;--u-soft:#ecebfb}
.u3{--u:#d4691a;--u-rgb:212,105,26;--u-dark:#8f420c;--u-soft:#fcefe3}
.u4{--u:#c23b5a;--u-rgb:194,59,90;--u-dark:#7d1f36;--u-soft:#fbe8ed}
*{box-sizing:border-box}
body{margin:0;font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif;background:var(--paper);color:var(--ink);line-height:1.85;font-size:17px}
button{font:inherit;cursor:pointer;color:inherit}
.i{width:1.15em;height:1.15em;vertical-align:-.2em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.app{display:grid;grid-template-columns:300px 1fr;min-height:100vh}
/* sidebar */
aside{background:linear-gradient(180deg,#0c2f35,#0a252a);color:#e6f2f1;padding:22px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;font-weight:700;font-size:1.08rem;line-height:1.4}
.brand .logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#14a89f,#5b4bd6);display:grid;place-items:center;color:#fff}
.brand small{display:block;font-weight:400;color:#9cc4c0;font-size:.76rem}
.bar{height:8px;background:#ffffff1f;border-radius:8px;margin:16px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--amber),#ffd36b);transition:width .5s}
.barlbl{font-size:.78rem;color:#9cc4c0}
nav h4{display:flex;gap:8px;align-items:center;margin:16px 4px 4px;font-size:.76rem;color:#cfe3e1;font-weight:600;line-height:1.5}
nav h4 .sw{width:10px;height:10px;border-radius:3px;flex:none}
nav button{display:flex;gap:9px;align-items:center;width:100%;text-align:right;background:none;border:0;color:#d9ebe9;padding:5px 9px;border-radius:10px;font-size:.86rem;line-height:1.5}
nav button:hover{background:#ffffff12}
nav button.on{background:#ffffff1f;color:#fff;font-weight:600;box-shadow:inset -3px 0 0 var(--amber)}
nav .dot{flex:0 0 19px;height:19px;border-radius:50%;border:2px solid #6f9e99;display:grid;place-items:center;font-size:.66rem}
nav button.done .dot{background:var(--amber);border-color:var(--amber);color:var(--deep);font-weight:800}
/* main */
main{padding:26px clamp(16px,4.5vw,56px) 70px;max-width:1040px}
main:focus{outline:none}
main.anim{animation:enter .45s ease}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* hero banners */
.hero{position:relative;border-radius:22px;overflow:hidden;min-height:240px;display:flex;align-items:flex-end;color:#fff;box-shadow:var(--shadow);
  background-color:var(--u-dark);background-size:cover;background-position:center;margin-bottom:16px}
.hero .in{position:relative;padding:22px 26px;max-width:640px}
.hero .chip2{display:inline-flex;gap:6px;align-items:center;background:#ffffff26;backdrop-filter:blur(6px);border:1px solid #ffffff40;border-radius:30px;padding:2px 12px;font-size:.8rem;font-weight:600}
.hero h1{margin:8px 0 0;font-size:clamp(1.45rem,3.2vw,2.1rem);line-height:1.35;text-shadow:0 2px 12px #0005}
.hero .credit{position:absolute;left:12px;bottom:8px;font-size:.68rem;color:#ffffffc0}
.hero.big{min-height:420px}
.hero.big h1{font-size:clamp(1.8rem,4.4vw,2.8rem)}
.hero.big p{margin:10px 0 0;font-size:1.05rem;color:#ffffffe6}
.meta-row{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.86rem;color:var(--muted);margin:0 0 14px}
.meta-row span{display:inline-flex;gap:6px;align-items:center}
.meta-row b{color:var(--u)}
.lead{color:#3c5257;margin:0 0 14px;font-size:1.06rem}
.hint{display:inline-flex;gap:8px;align-items:center;font-weight:600;color:var(--u);background:var(--u-soft);padding:6px 14px;border-radius:30px;margin:6px 0 14px;font-size:.95rem}
.lobox{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-inline-start:0;border-radius:14px;padding:10px 16px;margin:0 0 14px;font-size:.9rem;box-shadow:var(--shadow)}
.lobox .ic{width:34px;height:34px;border-radius:10px;background:var(--u-soft);color:var(--u);display:grid;place-items:center;flex:none}
.lobox b{color:var(--u)}
/* cards */
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;text-align:right;transition:.25s;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.tile:hover{transform:translateY(-3px);box-shadow:0 10px 26px #0b2a3022;border-color:rgba(var(--u-rgb),.5)}
.tile .ic{width:46px;height:46px;border-radius:14px;background:var(--u-soft);color:var(--u);display:grid;place-items:center;font-size:1.35rem;transition:.25s}
.tile b{font-size:1.02rem}
.tile .q{color:var(--muted);font-size:.9rem}
.tile .more{display:none;font-size:.93rem;border-top:1px dashed var(--line);padding-top:8px;margin-top:4px}
.tile.open{border-color:var(--u);background:linear-gradient(180deg,var(--u-soft),#fff 70%)}
.tile.open .ic,.tile.seen .ic{background:var(--u);color:#fff}
.tile.open .more{display:block}
.num{position:absolute;inset-inline-end:14px;top:14px;background:var(--u);color:#fff;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:.85rem;font-weight:700}
.tile{position:relative}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 20px;margin:16px 0;box-shadow:var(--shadow)}
.box h3{margin:0 0 6px;font-size:1rem;color:var(--u);display:flex;gap:8px;align-items:center}
.fb{display:none;border-radius:16px;padding:12px 18px;margin:14px 0;font-weight:600;align-items:flex-start;gap:10px}
.fb.show{display:flex;animation:enter .35s}
.fb.ok{background:var(--okbg);color:#14613d;border:1px solid #a8dcc0}
.fb.no{background:var(--badbg);color:#8e2a20;border:1px solid #f0b8b1}
.fb .badge{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:.8rem;margin-top:2px}
.fb.ok .badge{background:var(--ok)}.fb.no .badge{background:var(--bad)}
.opts{display:grid;gap:10px;margin:12px 0}
.opt{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 16px;text-align:right;display:flex;gap:10px;align-items:center;transition:.2s}
.opt .k{flex:none;width:30px;height:30px;border-radius:9px;background:var(--u-soft);color:var(--u);display:grid;place-items:center;font-weight:700}
.opt:hover{border-color:var(--u)}
.opt.sel{border-color:var(--u);background:var(--u-soft)}
.opt.right{border-color:var(--ok);background:var(--okbg)}.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}.opt.wrong .k{background:var(--bad);color:#fff}
.btn{display:inline-flex;gap:8px;align-items:center;background:var(--u);color:#fff;border:0;border-radius:12px;padding:10px 22px;font-weight:600;box-shadow:0 4px 12px rgba(var(--u-rgb),.3);transition:.2s}
.btn:hover{transform:translateY(-1px)}
.btn:disabled{background:#b9c7c9;box-shadow:none;cursor:not-allowed;transform:none}
.btn.ghost{background:#fff;color:var(--u);border:2px solid var(--u);box-shadow:none}
.btn.amber{background:var(--amber);color:#3a2700;box-shadow:0 4px 12px #f2a51655}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:12px 0}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:30px;border-top:1px solid var(--line);padding-top:18px}
/* media */
.media{position:relative;background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;margin:14px 0;box-shadow:var(--shadow)}
.media>svg{display:block;width:100%;height:auto}
.cap{font-size:.78rem;color:var(--muted);padding:6px 14px 8px;border-top:1px solid var(--line);display:flex;gap:6px;align-items:center}
.hs{position:absolute;transform:translate(-50%,-50%);width:40px;height:40px;border-radius:50%;border:3px solid #fff;background:var(--amber);box-shadow:0 3px 10px #0005;font-weight:700;color:#3a2700;display:grid;place-items:center;font-size:.95rem;z-index:2}
.hs::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:3px solid var(--amber);animation:pulse 1.6s infinite}
.hs.seen{background:var(--ok);color:#fff}.hs.seen::after{display:none}
.hs.cur{outline:4px solid var(--u)}
@keyframes pulse{0%{transform:scale(.8);opacity:1}100%{transform:scale(1.5);opacity:0}}
.tip{position:absolute;z-index:3;width:min(270px,70%);background:var(--deep);color:#fff;border-radius:14px;padding:10px 14px;font-size:.88rem;line-height:1.65;box-shadow:0 8px 22px #0006;pointer-events:none}
.tip b{color:var(--amber);display:block}
.panel{background:var(--u-soft);border:2px solid var(--u);border-radius:18px;padding:12px 18px;margin-top:12px}
.panel h3{margin:0;color:var(--u-dark);font-size:1.02rem}
/* keywords */
.def{font-size:1.28rem;line-height:2.15;background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px 22px;box-shadow:var(--shadow)}
.kw{border-radius:6px;padding:0 4px;transition:background .5s,color .5s}
.kw.lit{background:var(--amber);color:#3a2700;font-weight:700}
/* modal */
.modal{position:fixed;inset:0;background:#0c2f35b3;display:grid;place-items:center;z-index:20;padding:16px;animation:enter .25s}
.modal .in{background:#fff;border-radius:24px;max-width:520px;width:100%;overflow:hidden;box-shadow:0 20px 50px #0007}
.modal .top{height:150px;background-size:cover;background-position:center;background-color:var(--u)}
.modal .body{padding:18px 24px 22px}
.modal h2{margin:0 0 6px;color:var(--u);font-size:1.3rem;display:flex;gap:10px;align-items:center}
.modal .ex{background:var(--u-soft);border-radius:12px;padding:10px 14px;margin:12px 0}
/* stepper */
.stages{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0}
.stage{position:relative;background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px 10px;text-align:center;opacity:.4;transition:.35s;box-shadow:var(--shadow)}
.stage .ic{width:52px;height:52px;margin:0 auto 6px;border-radius:50%;background:var(--u-soft);color:var(--u);display:grid;place-items:center;font-size:1.5rem}
.stage b{display:block;font-size:.9rem;line-height:1.5}
.stage.on{opacity:1;border-color:var(--u)}
.stage.on .ic{background:var(--u);color:#fff}
.stage.cur{box-shadow:0 0 0 5px rgba(var(--u-rgb),.2);animation:pop .5s}
@keyframes pop{0%{transform:scale(.92)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
.stage:not(:last-child)::after{content:"";position:absolute;left:-12px;top:44px;width:12px;height:3px;background:var(--u)}
/* drag */
.zone{border:2px dashed var(--line);border-radius:18px;padding:12px;min-height:130px;background:#fff;text-align:right}
.zone h3{margin:0 0 8px;font-size:.95rem;color:var(--muted);display:flex;gap:8px;align-items:center}
.zone.target{border-color:rgba(var(--u-rgb),.6);background:var(--u-soft)}
.zone.over,.zone.armed{border-style:solid;border-color:var(--u);box-shadow:0 0 0 4px rgba(var(--u-rgb),.15)}
.chips{display:flex;flex-wrap:wrap;gap:10px;min-height:46px}
.chip{display:inline-flex;gap:8px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:30px;padding:7px 15px;box-shadow:0 2px 6px #0b2a3012}
.chip .i{color:var(--u)}
.chip:hover{border-color:var(--amber)}
.chip.picked{border-color:var(--amber);background:#fff5df;box-shadow:0 0 0 3px #f2a51655}
.chip.bad{border-color:var(--bad);background:var(--badbg)}
.chip.good{border-color:var(--ok);background:var(--okbg)}
/* flip */
.flip{perspective:900px;height:200px;background:none;border:0;padding:0;text-align:right}
.flip .in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;padding:16px;display:flex;flex-direction:column;justify-content:center;gap:6px;box-shadow:var(--shadow)}
.flip .f{background:#fff;border:1px solid var(--line)}
.flip .f .ic{width:50px;height:50px;border-radius:14px;background:var(--u-soft);color:var(--u);display:grid;place-items:center;font-size:1.45rem}
.flip .b{background:linear-gradient(150deg,var(--u),var(--u-dark));color:#fff;transform:rotateY(180deg);font-size:.95rem}
.flip .f small{color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
/* cover & menu */
.units{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:14px}
.ucard{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow);transition:.25s}
.ucard:hover{transform:translateY(-3px);box-shadow:0 12px 30px #0b2a3022}
.ucard .ph{height:120px;background-size:cover;background-position:center;background-color:var(--u);position:relative}
.ucard .ph span{position:absolute;inset-inline-start:12px;bottom:10px;background:var(--u);color:#fff;font-size:.75rem;font-weight:700;padding:2px 10px;border-radius:20px}
.ucard .bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.ucard h3{margin:0;font-size:1.06rem}
.ucard p{margin:0;font-size:.86rem;color:var(--muted);flex:1}
.ucard .pr{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.ucard .pr i{display:block;height:100%;background:var(--u)}
.goals{padding:0;margin:0;list-style:none;display:grid;gap:8px}
.goals li{display:flex;gap:10px;align-items:flex-start}.goals li .i{color:var(--u);margin-top:.35em}
.score{font-size:2.8rem;font-weight:700;color:var(--u);line-height:1.2}
.refs li{margin-bottom:8px}
.refs a{color:var(--u);word-break:break-all}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.legend div{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:.9rem;box-shadow:var(--shadow)}
.legend .ic{width:34px;height:34px;border-radius:10px;background:#e1f3f1;color:#0e8a83;display:grid;place-items:center;flex:none}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.photos a{display:block;text-decoration:none;color:var(--muted);font-size:.72rem;line-height:1.4}
.photos .th{height:84px;border-radius:10px;background-size:cover;background-position:center;background-color:#cfdcde;margin-bottom:4px}
.menuBtn{display:none}
/* svg states */
svg text{font-family:inherit}
.link{stroke-dasharray:6 6}
.svgOn .link{animation:flow 1s linear infinite;stroke:var(--u)}
@keyframes flow{to{stroke-dashoffset:-24}}
.node circle.c{fill:#fff;stroke:var(--u);stroke-width:3;transition:.3s}
.node .ig{color:var(--u);transition:.3s}
.node.hl circle.c{fill:var(--u);stroke:var(--u-dark);stroke-width:4}
.node.hl .ig{color:#fff}
.room{fill:#fff;stroke:#9db3b6;stroke-width:3;transition:.3s}
.on-living .r-living,.on-bed .r-bed,.on-door .r-door{fill:#f1eefc}
.lamp{fill:#d8dee0;transition:.3s}.on-living .lamp{fill:#f2a516}
.glow{opacity:0;transition:.3s}.on-living .glow{opacity:.45}
.acwave{opacity:0;transition:.3s}.on-bed .acwave{opacity:1}
.alert{opacity:0;transition:.3s}.on-door .alert{opacity:1}
.cls-board .z-board,.cls-door .z-door,.cls-power .z-power{stroke:#f2a516;stroke-width:5}
.w-watch .z-watch,.w-remote .z-remote,.w-alert .z-alert{stroke:#f2a516;stroke-width:5}
.bad-hr{display:none}.w-alert .bad-hr{display:inline}.w-alert .hr-ok{display:none}
.lockon{opacity:0;transition:.3s}.p-enc .lockon{opacity:1}
.p-consent .z-consent{stroke:#f2a516;stroke-width:5}
.fixed-pw .pw-bad{display:none}.pw-good{display:none}.fixed-pw .pw-good{display:inline}
.fixed-fw .fw-bad{display:none}.fw-good{display:none}.fixed-fw .fw-good{display:inline}
.fixed-pw .z-pw,.fixed-fw .z-fw{stroke:#1e8e5a}
@media(max-width:860px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;inset:0 0 0 auto;width:min(300px,86vw);display:none;z-index:15;box-shadow:0 0 0 100vmax #0007}
  aside.show{display:block}
  .menuBtn{display:inline-flex;gap:6px;align-items:center;position:sticky;top:10px;z-index:4;margin:10px 16px 0;background:var(--deep);color:#fff;border:0;border-radius:12px;padding:8px 14px}
  main{padding-top:12px}
  .hero{min-height:170px}.hero.big{min-height:300px}.hero .in{padding:16px 18px}
  .stages{grid-template-columns:repeat(2,1fr)}
  .stage:not(:last-child)::after{display:none}
  .hs{width:32px;height:32px;font-size:.85rem}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside id="side" aria-label="قائمة المحتويات">
    <div class="brand"><span class="logo" id="logo"></span><span>إنترنت الأشياء<small>مسار تعلم رقمي تفاعلي · 4 وحدات RLOs</small></span></div>
    <div class="bar"><i id="barFill"></i></div>
    <div class="barlbl" id="barLbl"></div>
    <nav id="nav"></nav>
  </aside>
  <div>
    <button class="menuBtn" id="menuBtn" aria-controls="side"></button>
    <main id="main" tabindex="-1"></main>
  </div>
</div>

<script>
/* =========================================================
   أيقونات خطية موحدة (رُسمت لهذا المنتج)
   ========================================================= */
const ci=(x,y,r)=>`M${x-r} ${y}a${r} ${r} 0 1 0 ${2*r} 0a${r} ${r} 0 1 0 ${-2*r} 0`;
const P={
 thermo:'M14 14.8V4a2 2 0 1 0-4 0v10.8a4 4 0 1 0 4 0ZM12 9v8',
 wifi:'M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0M2 9a15 15 0 0 1 20 0M12 19.5h.01',
 cloud:'M17.5 19H8a5 5 0 1 1 .9-9.9A6 6 0 0 1 20 11a4 4 0 0 1-2.5 8Z',
 phone:'M8 2h8a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2ZM11 18h2',
 target:ci(12,12,10)+ci(12,12,6)+ci(12,12,2),
 clip:'M9 3h6v3H9zM7 4.5H5V21h14V4.5h-2M8 11h8M8 15h6',
 wrench:'M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.5-.6-.6-2.5Z',
 flask:'M9 3h6M10 3v6L4.5 19a1.5 1.5 0 0 0 1.3 2h12.4a1.5 1.5 0 0 0 1.3-2L14 9V3M7 15h10',
 lock:'M5 11h14v10H5zM8 11V7a4 4 0 0 1 8 0v4M12 15v2',
 hand:'M8 13V5.5a1.5 1.5 0 0 1 3 0V12M11 11.5V4.5a1.5 1.5 0 0 1 3 0V12M14 6.5a1.5 1.5 0 0 1 3 0V13M17 9.5a1.5 1.5 0 0 1 3 0V15a7 7 0 0 1-7 7h-1a7 7 0 0 1-5.6-2.8L4 16a1.5 1.5 0 0 1 2.4-1.8L8 16',
 growth:'M3 3v18h18M7 15l4-4 3 3 6-6M15 8h5v5',

const KEY='iot-rlo-progress-v2';
let ST={done:[],first:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)); if(s&&s.done) ST=s;}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(ST))}catch(e){}};
const isDone=id=>ST.done.includes(id);
function finish(id){ if(!isDone(id)){ST.done.push(id); save();} paintNav(); }
function attempt(key,ok){ if(!(key in ST.first)){ST.first[key]=ok; save();} }
const lessons=S.filter(s=>s.u&&!['unitEnd','unitIntro'].includes(s.kind));
const unitLessons=k=>lessons.filter(s=>s.u===k);
const COL=['','#0e8a83','#5b4bd6','#d4691a','#c23b5a'];

let cur=0;
const $=(q,r=document)=>r.querySelector(q);
const el=(t,c,h)=>{const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;};
const L=['أ','ب','ج','د'];
const OK=`<span class="badge">${I('check')}</span>`, NO=`<span class="badge">${I('x')}</span>`;
function setFb(fb,ok,txt){ fb.className='fb show '+(ok?'ok':'no'); fb.innerHTML=(ok?OK:NO)+`<span>${txt}</span>`; }
const fbBox=t=>{const f=el('div','fb ok'); f.innerHTML=OK+`<span>${t}</span>`; return f;};

function paintNav(){
  const nav=$('#nav'); nav.innerHTML=''; let lastU=-1;
  S.forEach((s,i)=>{
    const u=s.u||0;
    if(u!==lastU){ nav.append(el('h4','',u?`<span class="sw" style="background:${COL[u]}"></span>${UNITS[u-1].code} · ${UNITS[u-1].title}`:(i===0?'البداية':'الختام'))); lastU=u; }
    const b=el('button',(i===cur?'on ':'')+(isDone(s.id)?'done':''),`<span class="dot">${isDone(s.id)?'✓':''}</span><span>${s.nav}</span>`);
    if(i===cur) b.setAttribute('aria-current','page');
    b.onclick=()=>go(i); nav.append(b);
  });
  const n=lessons.filter(s=>isDone(s.id)).length;
  $('#barFill').style.width=(n/lessons.length*100)+'%';
  $('#barLbl').textContent=`أنجزت ${n} من ${lessons.length} شاشة تعليمية`;
}
function go(i,push=true){
  i=Math.max(0,Math.min(S.length-1,i)); cur=i;
  const s=S[i], m=$('#main'); m.innerHTML='';
  m.className='u'+(s.u||1); void m.offsetWidth; m.classList.add('anim');
  R[s.kind](s,m);
  const p=el('div','pager');
  const prev=el('button','btn ghost',I('arrowR')+' السابق'); prev.onclick=()=>go(i-1); prev.style.visibility=i?'visible':'hidden';
  const next=el('button','btn',(i===0?'ابدأ':'التالي')+' '+I('arrowL')); next.onclick=()=>go(i+1); next.style.visibility=i<S.length-1?'visible':'hidden';
  p.append(prev,next); m.append(p);
  if(['cover','guide','menu','refs','unitIntro'].includes(s.kind)) finish(s.id);
  paintNav(); $('#side').classList.remove('show');
  if(push) history.replaceState(null,'','#'+s.id);
  window.scrollTo(0,0); m.focus({preventScroll:true});
}
function hero(s,m){
  const U=UNITS[s.u-1], list=unitLessons(s.u), pos=list.indexOf(s)+1;

}

/* سحب وإفلات عام */
function dnd(zones,onChange){
  let dragged=null, picked=null;
  const move=(c,z)=>{ $('.chips',z).append(c); c.classList.remove('picked'); picked=null; zones.forEach(x=>x.classList.remove('armed')); onChange(); };
  zones.forEach(z=>{
    z.ondragover=e=>{e.preventDefault(); z.classList.add('over')};
    z.ondragleave=()=>z.classList.remove('over');
    z.ondrop=e=>{e.preventDefault(); z.classList.remove('over'); if(dragged) move(dragged,z); dragged=null;};
    z.onclick=e=>{ if(picked && !e.target.closest('.chip')) move(picked,z); };
  });
  return {wire(c){ c.draggable=true; c.ondragstart=()=>{dragged=c};
    c.onclick=e=>{ e.stopPropagation();
      if(picked===c){c.classList.remove('picked'); picked=null; zones.forEach(x=>x.classList.remove('armed')); return;}
      if(picked && picked.closest('.zone')!==c.closest('.zone')){ move(picked,c.closest('.zone')); return; }
      if(picked) picked.classList.remove('picked');
      picked=c; c.classList.add('picked'); zones.forEach(x=>x.classList.toggle('armed',x!==c.closest('.zone'))); }; }};
}

/* S1.4 */
R.classify=(s,m)=>{
  hero(s,m); m.append(hint(s.hint));
  const pool=el('div','zone',`<h3>${I('grid')} العناصر</h3><div class="chips"></div>`);
  const bins=s.bins.map(b=>el('div','zone target',`<h3>${I(b.ic)} ${b.t}</h3><div class="chips"></div>`));
  const two=el('div','grid'); bins.forEach(b=>two.append(b));
  const btn=el('button','btn',I('check')+' تحقق من الإجابة'), fb=el('div','fb'), row=el('div','row'); btn.disabled=true; row.append(btn);
  const D=dnd([pool,...bins],()=>{ btn.disabled=$('.chips',pool).children.length>0; fb.className='fb'; [pool,two].forEach(z=>z.querySelectorAll('.chip').forEach(c=>c.classList.remove('good','bad'))); });
  s.items.forEach(it=>{const c=el('button','chip',I(it.ic)+' '+it.t); c.dataset.b=it.b; D.wire(c); $('.chips',pool).append(c);});
  btn.onclick=()=>{ let ok=true;
    bins.forEach((z,bi)=>z.querySelectorAll('.chip').forEach(c=>{const g=+c.dataset.b===bi; c.classList.add(g?'good':'bad'); if(!g) ok=false;}));
    attempt(s.id,ok); setFb(fb,ok,ok?s.ok:s.no); if(ok) finish(s.id); };
  m.append(pool,el('div','',''),two,row,fb); pool.style.marginBottom='14px';
};

/* S2.1 و S4.2 */
R.hotspot=(s,m)=>{
  hero(s,m); m.append(hint(s.hint));
  const box=media(s.img(),s.cap), svg=box.querySelector('svg'), panel=el('div','panel',`<h3>${I('hand')} اختر نقطة على الصورة</h3>`), fb=fbBox(s.fb), seen=new Set();
  s.spots.forEach((p,i)=>{
    const h=el('button','hs',String(i+1)); h.style.left=p.x+'%'; h.style.top=p.y+'%'; h.setAttribute('aria-label',p.t);
    h.onclick=()=>{ seen.add(i); h.classList.add('seen'); box.querySelectorAll('.hs').forEach(x=>x.classList.toggle('cur',x===h));
      if(s.keep) svg.classList.add(p.cls); else { s.spots.forEach(q=>svg.classList.remove(q.cls)); svg.classList.add(p.cls); }
      panel.innerHTML=`<h3>${I(p.ic)} ${p.t}</h3>${p.d}`;
      if(seen.size===s.spots.length){fb.classList.add('show'); finish(s.id);} };
    box.append(h);
  });
  m.append(box,panel,fb); if(isDone(s.id)) fb.classList.add('show');
};

/* S2.2 */
R.hover=(s,m)=>{
  hero(s,m); m.append(hint(s.hint));
  const box=media(s.img(),s.cap), svg=box.querySelector('svg'), tip=el('div','tip'), fb=fbBox(s.fb), seen=new Set();
  tip.style.display='none'; box.append(tip);
  const hide=()=>{tip.style.display='none'; s.spots.forEach(q=>svg.classList.remove(q.cls));};
  s.spots.forEach((p,i)=>{
    const h=el('button','hs',String(i+1)); h.style.left=p.x+'%'; h.style.top=p.y+'%'; h.setAttribute('aria-label',p.t);
    const showTip=()=>{ hide(); svg.classList.add(p.cls); tip.innerHTML=`<b>${p.t}</b>${p.d}`; tip.style.display='block';
      tip.style.top=`calc(${p.y}% + 28px)`; tip.style.left=p.x>55?'auto':`calc(${p.x}% - 20px)`; tip.style.right=p.x>55?`calc(${100-p.x}% - 20px)`:'auto';
      seen.add(i); h.classList.add('seen'); if(seen.size===s.spots.length){fb.classList.add('show'); finish(s.id);} };
    h.onmouseenter=showTip; h.onfocus=showTip; h.onclick=showTip; h.onmouseleave=hide; h.onblur=hide;
    box.append(h);
  });
  m.append(box,fb); if(isDone(s.id)) fb.classList.add('show');
};

/* S2.3 */
R.flip=(s,m)=>{
  hero(s,m); m.append(hint(s.hint));
  const box=media(s.img(),s.cap), svg=box.querySelector('svg'), g=el('div','grid'), fb=fbBox(s.fb), seen=new Set();
  s.items.forEach((it,i)=>{
    const c=el('button','flip',`<div class="in"><div class="f"><span class="ic">${I(it.ic)}</span><b>${it.t}</b><small>اضغط لقلب البطاقة</small></div><div class="b"><b style="color:#ffd36b">${it.t}</b>${it.d}</div></div>`);
    c.setAttribute('aria-pressed','false');
    c.onclick=()=>{ const on=c.classList.toggle('on'); c.setAttribute('aria-pressed',on);
      s.items.forEach(x=>svg.classList.remove(x.cls)); if(on) svg.classList.add(it.cls);
      seen.add(i); if(seen.size===s.items.length){fb.classList.add('show'); finish(s.id);} };
    g.append(c);
  });
  m.append(box,g,fb); if(isDone(s.id)) fb.classList.add('show');
};

/* S3.1 و S3.2 و S4.1 و S4.3 */
R.reveal=(s,m)=>{
  hero(s,m); m.append(hint(s.hint));
  let svg=null; if(s.img){const b=media(s.img(),s.cap); svg=b.querySelector('svg'); m.append(b);}
  const g=el('div',s.steps?'steps':'grid'), fb=fbBox(s.fb), seen=new Set();
  s.items.forEach((it,i)=>{
    const t=el('button','tile',`${s.numbered?`<span class="num">${i+1}</span>`:''}<span class="ic">${I(it.ic)}</span><b>${it.t}</b><span class="q">${it.q}</span><span class="more">${it.m}</span>`);
    t.setAttribute('aria-expanded','false');
    t.onclick=()=>{ const o=t.classList.toggle('open'); t.setAttribute('aria-expanded',o); seen.add(i);
      if(svg&&it.cls){ s.items.forEach(x=>x.cls&&svg.classList.remove(x.cls)); if(o) svg.classList.add(it.cls); if(it.cls==='p-enc'&&o) svg.classList.add('svgOn'); }
      if(seen.size===s.items.length){fb.classList.add('show'); finish(s.id);} };
    g.append(t);
  });
  m.append(g,fb); if(isDone(s.id)) fb.classList.add('show');
};

/* S3.3 */
R.build=(s,m)=>{
  hero(s,m); m.append(hint(s.hint));
  const pool=el('div','zone',`<h3>${I('grid')} المكونات المتاحة</h3><div class="chips"></div>`);
  const board=el('div','zone target',`<h3>${I('cpu')} لوحة النظام</h3><div class="chips"></div>`);
  const two=el('div','grid'); two.append(pool,board);
  const need=s.parts.filter(p=>p.ok).length, btn=el('button','btn',I('check')+' تحقق من التركيب'), fb=el('div','fb'), res=el('div'), row=el('div','row'); btn.disabled=true; row.append(btn);
  const D=dnd([pool,board],()=>{ btn.disabled=board.querySelectorAll('.chip').length<need; fb.className='fb'; res.innerHTML='';
    two.querySelectorAll('.chip').forEach(c=>c.classList.remove('good','bad')); });
  s.parts.forEach(p=>{const c=el('button','chip',I(p.ic)+' '+p.t); c.dataset.ok=p.ok; D.wire(c); $('.chips',pool).append(c);});
  btn.onclick=()=>{ const on=[...board.querySelectorAll('.chip')]; on.forEach(c=>c.classList.add(c.dataset.ok==='1'?'good':'bad'));
    const ok=on.length===need&&on.every(c=>c.dataset.ok==='1'); attempt(s.id,ok); setFb(fb,ok,ok?s.ok:s.no);
    if(ok){ res.innerHTML=''; const b=media(s.done(),'النظام الذي صمّمته: من القياس إلى العرض'); b.firstChild.classList.add('svgOn'); b.querySelectorAll('.node').forEach(n=>n.classList.add('hl')); res.append(b); finish(s.id);} };
  m.append(two,row,fb,res);
};

/* الاختيار من متعدد والسيناريوهات */
R.quiz=(s,m)=>{
  hero(s,m); let solved=0; const boxes=[];
  s.qs.forEach((q,qi)=>{
    const box=el('div','box',`<h3>${I(s.seq?'compass':'question')} ${q.s}</h3><b>${q.q}</b>`), opts=el('div','opts'), fb=el('div','fb'), acts=el('div','row');
    const btn=el('button','btn',I('check')+' '+s.btn); btn.disabled=true; let sel=null, locked=false;
    q.o.forEach((o,oi)=>{ const b=el('button','opt',`<span class="k">${L[oi]}</span><span>${o.t}</span>`);
      b.onclick=()=>{ if(locked) return; sel=oi; [...opts.children].forEach(x=>x.classList.remove('sel','wrong')); b.classList.add('sel'); btn.disabled=false; fb.className='fb'; };
      opts.append(b); });
    btn.onclick=()=>{ const o=q.o[sel], b=opts.children[sel]; attempt(s.id+qi,!!o.ok);
      b.classList.remove('sel'); b.classList.add(o.ok?'right':'wrong'); setFb(fb,!!o.ok,o.f||q.wrong); btn.disabled=true;
      if(o.ok){ locked=true; solved++;
        if(s.seq && qi<s.qs.length-1){ const nx=el('button','btn amber','متابعة '+I('arrowL')); nx.onclick=()=>{nx.remove(); boxes[qi+1].style.display=''; boxes[qi+1].scrollIntoView({behavior:'smooth',block:'center'});}; acts.append(nx); }
        if(solved===s.qs.length) finish(s.id); } };
    acts.append(btn); box.append(opts,acts,fb); if(s.seq&&qi>0&&!isDone(s.id)) box.style.display='none';
    boxes.push(box); m.append(box);
  });
};

/* ختام الوحدة */
function unitScore(U){ const k=U.keys, r=k.filter(x=>ST.first[x]===true).length, t=k.filter(x=>x in ST.first).length; return {r,t,n:k.length}; }
R.unitEnd=(s,m)=>{
  const U=UNITS[s.u-1], list=unitLessons(U.k), n=list.filter(x=>isDone(x.id)).length, sc=unitScore(U);
  const h=el('div','hero',`<div class="in"><span class="chip2">${I('trophy')} ${U.code} · ختام الوحدة</span><h1>أنهيت وحدة «${U.title}»</h1></div><span class="credit">${credit(U.ph)}</span>`);
  h.setAttribute('style',heroBg(U.ph,1260)); m.append(h);
  m.append(el('div','lobox',`<span class="ic">${I('target')}</span><span><b>ناتج التعلم:</b> ${U.lo}</span>`));
  m.append(el('div','box',`<h3>${I('trophy')} إجاباتك الصحيحة من المحاولة الأولى في تقويمات الوحدة</h3><div class="score" dir="ltr">${sc.r} / ${sc.n}</div>
    <div>أنجزت ${n} من ${list.length} شاشات.${sc.t<sc.n?' بقيت أسئلة لم تُجب عنها بعد.':''}</div>`));
  m.append(el('div','box',`<h3>${I('sparkle')} تذكّر</h3><ul class="goals">${U.sum.map(x=>`<li>${I('check')}<span>${x}</span></li>`).join('')}</ul>`));
  const row=el('div','row'), a=el('button','btn ghost',I('grid')+' القائمة الرئيسة'); a.onclick=()=>go(S.findIndex(x=>x.id==='menu')); row.append(a);
  if(U.k<4){const b=el('button','btn',`الوحدة التالية: ${UNITS[U.k].title} `+I('arrowL')); b.onclick=()=>go(S.findIndex(x=>x.id==='rlo'+(U.k+1))); row.append(b);}
  m.append(row); if(n===list.length) finish(s.id);
};

/* الخلاصة */
R.final=(s,m)=>{
  m.className='u1 anim';
  const all=UNITS.flatMap(U=>U.keys), r=all.filter(k=>ST.first[k]===true).length, n=lessons.filter(x=>isDone(x.id)).length;
  const h=el('div','hero',`<div class="in"><span class="chip2">${I('trophy')} الختام</span><h1>الخلاصة ونتيجتك</h1></div><span class="credit">${credit(PH.cover)}</span>`);
  h.setAttribute('style',heroBg(PH.cover,1260)); m.append(h);
  m.append(el('div','box',`<h3>${I('trophy')} إجاباتك الصحيحة من المحاولة الأولى في المسار كله</h3><div class="score" dir="ltr">${r} / ${all.length}</div><div>أنجزت ${n} من ${lessons.length} شاشة تعليمية.</div>`));
  const g=el('div','units');
  UNITS.forEach(U=>{const sc=unitScore(U), list=unitLessons(U.k), d=list.filter(x=>isDone(x.id)).length;
    g.append(el('div','ucard u'+U.k,`<div class="ph" style="background-image:url('${purl(U.ph,640)}');height:80px"><span>${U.code}</span></div><div class="bd"><h3>${U.title}</h3><p>التقويم: ${sc.r} من ${sc.n} · الشاشات: ${d} من ${list.length}</p><div class="pr"><i style="width:${d/list.length*100}%"></i></div></div>`));});
  m.append(g);
  m.append(el('div','box',`<h3>${I('sparkle')} نشاط إثرائي</h3>اختر مشكلة حقيقية في مدرستك أو مكان عملك، وطبّق عليها مراحل التصميم الأربع: ما المشكلة؟ ماذا ستقيس ومن يستلم البيانات؟ ما المكونات المناسبة؟ وأين ستجرّب الحل أولاً؟ ثم حدّد إجراءين لحماية خصوصية المستخدمين وأمن الأجهزة.`));
  const rs=el('button','btn ghost',I('refresh')+' مسح التقدم وإعادة المسار');
  rs.onclick=()=>{ ST={done:[],first:{}}; save(); go(0); };
  m.append(rs); finish(s.id);
};

   <li>الهيئة السعودية للبيانات والذكاء الاصطناعي (سدايا). <i>نظام حماية البيانات الشخصية</i> (المرسوم الملكي م/19، 1443هـ) ولائحته التنفيذية. <a href="https://sdaia.gov.sa" target="_blank" rel="noopener">https://sdaia.gov.sa</a></li></ol>`));

   <div class="photos">${list.map(p=>`<a href="${ppage(p)}" target="_blank" rel="noopener"><div class="th" style="background-image:url('${purl(p,300)}')"></div>${p.t}${p.by?' — '+p.by:''}</a>`).join('')}</div>`));
  m.append(el('div','box',`<h3>${I('sparkle')} الرسوم والأيقونات</h3>الرسوم التوضيحية والصور التفاعلية (المنزل، والفصل، والساعة، والجوال، والكاميرا، ومخططات التدفق) والأيقونات رسوم SVG أصلية أُعدّت خصيصاً لهذا المنتج. الخط: IBM Plex Sans Arabic من Google Fonts وفق رخصة SIL Open Font License. يُتاح المنتج وفق رخصة المشاع الإبداعي <b>CC BY-NC-SA 4.0</b>.`));
};

/* =========================================================
   التشغيل والروابط المباشرة لكل وحدة (#rlo1 … #rlo4)
   ========================================================= */
function fromHash(){ const h=location.hash.slice(1); const i=S.findIndex(x=>x.id===h); return i<0?0:i; }
$('#logo').innerHTML=I('wifi');
$('#menuBtn').innerHTML=I('menu')+' المحتويات';
$('#menuBtn').onclick=()=>$('#side').classList.toggle('show');
window.addEventListener('hashchange',()=>{const i=fromHash(); if(i!==cur) go(i);});
go(fromHash());
