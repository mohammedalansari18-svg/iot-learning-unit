<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إنترنت الأشياء: التصميم والأخلاقيات والأمن — وحدة تعليمية تفاعلية</title>
<style>
:root{
  --ink:#0f2a2e; --deep:#0b3b40; --teal:#0e7c7b; --mint:#d9f2ee; --paper:#f6faf9;
  --card:#ffffff; --line:#d5e3e1; --amber:#f2a516; --ok:#1e8e5a; --okbg:#e3f6ec;
  --bad:#c0392b; --badbg:#fdecea; --muted:#5b7376;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Tahoma,"Noto Sans Arabic","Noto Kufi Arabic",Arial,sans-serif;
  background:var(--paper);color:var(--ink);line-height:1.8;font-size:17px}
button{font:inherit;cursor:pointer}
.app{display:grid;grid-template-columns:290px 1fr;min-height:100vh}
aside{background:var(--deep);color:#e8f5f3;padding:24px 18px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-weight:800;font-size:1.15rem;line-height:1.5;margin-bottom:6px}
.brand small{display:block;font-weight:400;color:#a9d2cd;font-size:.8rem}
.bar{height:8px;background:#ffffff22;border-radius:8px;margin:16px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--amber);transition:width .4s}
.barlbl{font-size:.8rem;color:#a9d2cd;margin-bottom:14px}
nav h4{margin:18px 0 6px;font-size:.78rem;color:var(--amber);letter-spacing:.02em}
nav button{display:flex;gap:10px;align-items:center;width:100%;text-align:right;background:none;border:0;
  color:#e8f5f3;padding:9px 10px;border-radius:10px;font-size:.92rem}
nav button:hover{background:#ffffff14}
nav button.on{background:var(--teal);font-weight:700}
nav .dot{flex:0 0 22px;height:22px;border-radius:50%;border:2px solid #7fb9b3;display:grid;place-items:center;font-size:.72rem}
nav button.done .dot{background:var(--amber);border-color:var(--amber);color:var(--deep);font-weight:800}
main:focus{outline:none}
main{padding:36px clamp(18px,5vw,64px) 80px;max-width:980px}
.tag{display:inline-block;background:var(--mint);color:var(--teal);font-weight:700;font-size:.8rem;padding:2px 12px;border-radius:20px}
h1{font-size:clamp(1.5rem,3.4vw,2.1rem);margin:10px 0 8px;line-height:1.4}
.lead{color:var(--muted);margin:0 0 22px;font-size:1.05rem}
.hint{display:flex;gap:8px;align-items:center;font-weight:700;color:var(--teal);margin:18px 0 12px}
.hint::before{content:"👆"}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.tile{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px;text-align:right;
  transition:.2s;display:flex;flex-direction:column;gap:6px;color:inherit}
.tile:hover{border-color:var(--teal);transform:translateY(-2px)}
.tile .ic{font-size:1.8rem;line-height:1}
.tile b{font-size:1.02rem}
.tile .q{color:var(--muted);font-size:.9rem}
.tile .more{display:none;font-size:.92rem;border-top:1px dashed var(--line);padding-top:8px;margin-top:4px}
.tile.open{border-color:var(--teal);background:#f0faf8}
.tile.open .more{display:block}
.tile .num{align-self:flex-start;background:var(--deep);color:#fff;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:.85rem;font-weight:700}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin:18px 0}
.box h3{margin:0 0 6px;font-size:1rem;color:var(--teal)}
.fb{display:none;border-radius:14px;padding:14px 18px;margin:16px 0;font-weight:600}
.fb.show{display:block}
.fb.ok{background:var(--okbg);color:#14613d;border:1px solid #a8dcc0}
.fb.no{background:var(--badbg);color:#8e2a20;border:1px solid #f0b8b1}
.opts{display:grid;gap:10px;margin:14px 0}
.opt{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 16px;text-align:right;color:inherit}
.opt:hover{border-color:var(--teal)}
.opt.sel{border-color:var(--teal);background:#f0faf8}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.btn{background:var(--teal);color:#fff;border:0;border-radius:12px;padding:10px 22px;font-weight:700}
.btn:disabled{background:#b9c9c7;cursor:not-allowed}
.btn.ghost{background:none;color:var(--teal);border:2px solid var(--teal)}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:34px;border-top:1px solid var(--line);padding-top:20px}
.dd{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.zone{border:2px dashed var(--line);border-radius:16px;padding:14px;min-height:190px;background:var(--card)}
.zone h3{margin:0 0 10px;font-size:.95rem;color:var(--muted)}
.zone.board{border-color:var(--teal);background:#f0faf8}
.zone.over{background:var(--mint)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{background:#fff;border:2px solid var(--line);border-radius:30px;padding:8px 16px;color:inherit;touch-action:manipulation}
.chip:hover{border-color:var(--amber)}
.chip.bad{border-color:var(--bad);background:var(--badbg)}
.chip.good{border-color:var(--ok);background:var(--okbg)}
.goals{padding:0;margin:0;list-style:none;display:grid;gap:8px}
.goals li{display:flex;gap:10px}.goals li::before{content:"◆";color:var(--amber)}
.score{font-size:3rem;font-weight:800;color:var(--teal);line-height:1.2}
.menuBtn{display:none}
@media(max-width:820px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;inset:0 0 0 auto;width:min(300px,86vw);display:none;z-index:5;box-shadow:0 0 0 100vmax #0006}
  aside.show{display:block}
  .menuBtn{display:inline-block;position:sticky;top:10px;z-index:4;margin:10px 16px 0;background:var(--deep);color:#fff;border:0;border-radius:10px;padding:8px 14px}
  main{padding-top:14px}.dd{grid-template-columns:1fr}
}
</style>
</head>

    <div class="bar"><i id="barFill"></i></div>
    <div class="barlbl" id="barLbl"></div>
    <nav id="nav"></nav>

  <div>
    <button class="menuBtn" id="menuBtn">☰ القائمة</button>
    <main id="main" tabindex="-1"></main>

/* ---------- الحالة ---------- */
const done = new Set(), first = {};   // first[key]=true إذا أصاب من المحاولة الأولى
let cur = 0;
const $ = (s,r=document)=>r.querySelector(s);
const el = (tag,cls,html)=>{const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e;};
const letters = ['أ','ب','ج','د'];

function finish(id){ done.add(id); paintNav(); }
function attempt(key, ok){ if(!(key in first)) first[key]=ok; }

function paintNav(){
  const nav=$('#nav'); nav.innerHTML='';
  L.forEach((l,i)=>{
    if(l.group) nav.append(el('h4','',l.group));
    const b=el('button', (i===cur?'on ':'')+(done.has(l.id)?'done':''), `<span class="dot">${done.has(l.id)?'✓':''}</span><span>${l.nav}</span>`);
    b.onclick=()=>go(i); nav.append(b);
  });
  const total=L.length-2, n=[...done].filter(x=>x!=='intro'&&x!=='end').length;
  $('#barFill').style.width=(n/total*100)+'%';
  $('#barLbl').textContent=`أنجزت ${n} من ${total} دروس`;
}

function go(i){
  cur=i; const l=L[i], m=$('#main'); m.innerHTML='';
  ({intro:rIntro,reveal:rReveal,drag:rDrag,quiz:rQuiz,end:rEnd})[l.type](l,m);
  const p=el('div','pager');
  const prev=el('button','btn ghost','→ السابق'); prev.onclick=()=>go(i-1); prev.style.visibility=i?'visible':'hidden';
  const next=el('button','btn', i===0?'ابدأ الوحدة ←':'متابعة ←'); next.onclick=()=>go(i+1); next.style.visibility=i<L.length-1?'visible':'hidden';
  p.append(prev,next); m.append(p);
  if(l.type==='intro') finish('intro');
  paintNav(); $('#side').classList.remove('show'); window.scrollTo(0,0); m.focus({preventScroll:true});
}

function head(l,m){
  if(l.tag) m.append(el('span','tag',l.tag));
  m.append(el('h1','',l.title));
  if(l.lead) m.append(el('p','lead',l.lead));
}

/* ---------- المقدمة ---------- */
function rIntro(l,m){
  m.append(el('span','tag','وحدة تعليمية تفاعلية'));
  m.append(el('h1','','إنترنت الأشياء: من التصميم إلى الاستخدام المسؤول'));
  m.append(el('p','lead','تتعلم في هذه الوحدة كيف يُصمَّم نظام لإنترنت الأشياء خطوة بخطوة، ثم كيف تُحمى بياناته وأجهزته ويُستخدم استخداماً مسؤولاً. كل درس يتضمن نشاطاً تفاعلياً أو تطبيقاً.'));
  m.append(el('div','box',`<h3>بنهاية الوحدة ستكون قادراً على أن:</h3><ul class="goals">
    <li>تعدّد مراحل تصميم نظام إنترنت الأشياء وتطبقها على مثال واقعي.</li>
    <li>تطبّق معايير التصميم الجيد: الأمان، وسهولة الاستخدام، وقابلية التوسع، وكفاءة الطاقة.</li>
    <li>تختار المكونات المناسبة لنظام مدرسة ذكية.</li>
    <li>توضّح ممارسات حماية الخصوصية وإجراءات الأمن السيبراني.</li>
    <li>تتخذ قرارات مسؤولة في مواقف واقعية تتعلق بالبيانات والأجهزة المتصلة.</li></ul>`));
  const g=el('div','grid');
  g.append(el('div','box','<h3>الوحدة الثالثة (RLO3)</h3>تصميم أنظمة إنترنت الأشياء: المراحل، المعايير، نشاط تصميم، واتخاذ قرار.'));
  g.append(el('div','box','<h3>الوحدة الرابعة (RLO4)</h3>الأخلاقيات والأمن: الخصوصية، الأمن السيبراني، المسؤولية، وتقويم بالمواقف.'));
  m.append(g);
}

/* ---------- الاستكشاف بالضغط ---------- */
function rReveal(l,m){
  head(l,m); m.append(el('div','hint',l.hint));
  const g=el('div','grid'), fb=el('div','fb ok',l.fb), seen=new Set();
  l.items.forEach((it,i)=>{
    const t=el('button','tile',`${l.numbered?`<span class="num">${i+1}</span>`:''}<span class="ic">${it.ic}</span><b>${it.t}</b><span class="q">${it.q}</span><span class="more">${it.m}</span>`);
    t.setAttribute('aria-expanded','false');
    t.onclick=()=>{ const o=t.classList.toggle('open'); t.setAttribute('aria-expanded',o); seen.add(i);
      if(seen.size===l.items.length){ fb.classList.add('show'); finish(l.id);} };
    g.append(t);
  });
  m.append(g,fb);
  if(done.has(l.id)) fb.classList.add('show');
}

/* ---------- السحب والإفلات ---------- */
function rDrag(l,m){
  head(l,m); m.append(el('div','hint',l.hint));
  const wrap=el('div','dd');
  const pool=el('div','zone','<h3>المكونات المتاحة</h3><div class="chips"></div>');
  const board=el('div','zone board','<h3>لوحة النظام</h3><div class="chips"></div>');
  const need=l.parts.filter(p=>p.ok).length;
  const fb=el('div','fb'), btn=el('button','btn','تحقق من التركيب'); btn.disabled=true;
  let dragged=null;
  const refresh=()=>{ btn.disabled = board.querySelectorAll('.chip').length < need;
    fb.className='fb'; [...wrap.querySelectorAll('.chip')].forEach(c=>c.classList.remove('good','bad')); };
  const move=(c,z)=>{ $('.chips',z).append(c); refresh(); };
  l.parts.forEach(p=>{
    const c=el('button','chip',p.t); c.draggable=true; c.dataset.ok=p.ok;
    c.onclick=()=>move(c, c.closest('.zone')===pool?board:pool);
    c.ondragstart=()=>{dragged=c};
    $('.chips',pool).append(c);
  });
  [pool,board].forEach(z=>{
    z.ondragover=e=>{e.preventDefault(); z.classList.add('over')};
    z.ondragleave=()=>z.classList.remove('over');
    z.ondrop=e=>{e.preventDefault(); z.classList.remove('over'); if(dragged) move(dragged,z); dragged=null;};
  });
  btn.onclick=()=>{
    const on=[...board.querySelectorAll('.chip')];
    on.forEach(c=>c.classList.add(c.dataset.ok==='1'?'good':'bad'));
    const ok = on.length===need && on.every(c=>c.dataset.ok==='1');
    attempt(l.id, ok);
    fb.className='fb show '+(ok?'ok':'no'); fb.textContent= ok?l.okFb:l.noFb;
    if(ok) finish(l.id);
  };
  wrap.append(pool,board); m.append(wrap, el('p'), btn, fb);
}

/* ---------- الأسئلة والمواقف ---------- */
function rQuiz(l,m){
  head(l,m); let solved=0;
  l.qs.forEach((q,qi)=>{
    const box=el('div','box',`<h3>${q.s}</h3><b>${q.q}</b>`), opts=el('div','opts'), fb=el('div','fb');
    const btn=el('button','btn',l.btn); btn.disabled=true; let sel=null, locked=false;
    q.o.forEach((o,oi)=>{
      const b=el('button','opt',`<b>${letters[oi]})</b> ${o.t}`);
      b.onclick=()=>{ if(locked) return; sel=oi;
        [...opts.children].forEach(x=>x.classList.remove('sel','wrong')); b.classList.add('sel');
        btn.disabled=false; fb.className='fb'; };
      opts.append(b);
    });
    btn.onclick=()=>{
      const o=q.o[sel], b=opts.children[sel]; attempt(l.id+qi, !!o.ok);
      b.classList.remove('sel'); b.classList.add(o.ok?'right':'wrong');
      fb.className='fb show '+(o.ok?'ok':'no'); fb.textContent=o.f||q.wrong;
      btn.disabled=true;
      if(o.ok){ locked=true; if(++solved===l.qs.length) finish(l.id); }
    };
    box.append(opts,btn,fb); m.append(box);
  });
}

/* ---------- الختام ---------- */
function rEnd(l,m){
  const keys=['s33','s340','s440','s441'], right=keys.filter(k=>first[k]===true).length, tried=keys.filter(k=>k in first).length;
  const total=L.length-2, n=[...done].filter(x=>x!=='intro'&&x!=='end').length;
  m.append(el('span','tag','الختام')); m.append(el('h1','','ملخص الوحدة ونتيجتك'));
  m.append(el('div','box',`<h3>الإجابات الصحيحة من المحاولة الأولى</h3><div class="score">${right} / ${keys.length}</div>
    <div>${tried<keys.length?'لم تُكمل بعد جميع الأنشطة التقويمية. ':''}أنجزت ${n} من ${total} دروس.</div>`));
  m.append(el('div','box',`<h3>أهم ما تعلمته</h3><ul class="goals">
    <li>التصميم يمر بأربع مراحل: تحديد المشكلة، تحديد المتطلبات، اختيار الأجهزة والمستشعرات، اختبار الحل.</li>
    <li>النظام الناجح آمن، سهل الاستخدام، قابل للتوسع، وكفء في استهلاك الطاقة.</li>
    <li>إدارة فترات الإرسال تحافظ على البطاريات دون إيقاف النظام.</li>
    <li>الخصوصية تُحمى بالموافقة المستنيرة وتشفير البيانات.</li>
    <li>تغيير كلمات المرور الافتراضية وتحديث البرامج الثابتة يغلقان أشهر الثغرات.</li>
    <li>البيانات تُستخدم فيما جُمعت من أجله فقط، ولا تُشارك دون تصريح.</li></ul>`));
  m.append(el('div','box',`<h3>نشاط إثرائي</h3>اختر مشكلة حقيقية في مدرستك أو مكان عملك، وطبّق عليها المراحل الأربع: ما المشكلة؟ ماذا ستقيس ومن يستلم البيانات؟ ما المكونات المناسبة؟ وأين ستجرّب الحل أولاً؟ ثم حدّد إجراءين لحماية خصوصية المستخدمين وأمن الأجهزة.`));
  const r=el('button','btn ghost','إعادة الوحدة من البداية');
  r.onclick=()=>{done.clear(); for(const k in first) delete first[k]; go(0);};
  m.append(r); finish('end');
}

$('#menuBtn').onclick=()=>$('#side').classList.toggle('show');
go(0);
</script>
